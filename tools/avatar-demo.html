<!doctype html>
<!--
  Demo del motor del avatar. Sirve desde la raíz del proyecto:
    python3 -m http.server 8765      →  http://localhost:8765/tools/avatar-demo.html
  También es el ejemplo mínimo de integración: un SVG con atributos data-av + avatar-engine.js.
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Agentik · demo del avatar</title>
  <style>
    body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #f4f4f4; color: #1e1e1e; display: flex; gap: 32px; padding: 24px; flex-wrap: wrap; }
    .stage { width: 360px; height: 360px; flex: none; }
    .stage svg { width: 100%; height: 100%; display: block; }
    .panel { max-width: 460px; }
    h3 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #777; }
    button { font: inherit; padding: 5px 10px; margin: 2px; border: 1px solid #bbb; border-radius: 8px; background: #fff; cursor: pointer; }
    button:hover { background: #eee; }
    button.on { background: #1e1e1e; color: #fff; border-color: #1e1e1e; }
    .circle, .patch { fill: #e6e6e6; }
    .brow, .lid { fill: none; stroke: #1e1e1e; stroke-linecap: round; }
    .brow { stroke-width: 1.4; } .lid { stroke-width: 1.5; }
    .pupil { fill: #1e1e1e; }
    .mouth { fill: #1e1e1e; stroke: #1e1e1e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    #log { font: 12px ui-monospace, monospace; color: #555; min-height: 3em; }
  </style>
</head>
<body>
  <div class="stage">
    <svg id="avatar" viewBox="0 0 163 163">
      <defs><clipPath id="av-clip"><circle cx="81.5" cy="81.5" r="81.5" /></clipPath>
        <!-- Recorte del torso con un hueco en la mandíbula (se mueve con la cabeza): oculta el cuello dentro de la cara. -->
        <clipPath id="av-neck"><path data-av="neckClip" clip-rule="evenodd" d="M-60 -60H223V223H-60Z M64 80H100V100.5H64Z" /></clipPath></defs>
      <circle class="circle" cx="81.5" cy="81.5" r="81.5" />
      <g clip-path="url(#av-clip)">
        <g clip-path="url(#av-neck)">
          <g data-av="torso"><image href="../assets/Agentik-torso.svg" width="163" height="163" /></g>
        </g>
        <g data-av="head">
          <image href="../assets/Agentik-head.svg" width="163" height="163" />
          <g>
            <rect class="patch" x="61" y="55.5" width="18.8" height="7.5" />
            <rect class="patch" x="89.5" y="55.5" width="18" height="7.5" />
            <rect class="patch" x="61.5" y="63.5" width="16" height="9.5" />
            <rect class="patch" x="91" y="63.5" width="14" height="9.5" />
            <rect class="patch" x="79.5" y="83.5" width="13" height="9" />
            <path class="brow" data-av="browL" d="M63 57.8 Q68.5 55.4 74 57.6" />
            <path class="brow" data-av="browR" d="M90.8 57.6 Q96.3 55.4 102.2 57.8" />
            <path class="lid" data-av="lidL" d="M64.9 68.4 Q69.9 64.4 74.9 68.4" />
            <path class="lid" data-av="lidR" d="M92.4 68.6 Q97.4 64.6 102.4 68.6" />
            <ellipse class="pupil" data-av="pupilL" cx="69.9" cy="69" rx="1.9" ry="2" />
            <ellipse class="pupil" data-av="pupilR" cx="97.4" cy="69.2" rx="1.9" ry="2" />
            <path class="mouth" data-av="mouth" d="M82 86.3 Q85.2 89 88.4 86.3" />
          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="panel">
    <h3>Estado — setAvatarState(state)</h3><div id="states"></div>
    <h3>Gesto — triggerGesture(name)</h3><div id="gestures"></div>
    <h3>Audio — startAudioSync(source)</h3>
    <button id="audio">Simular voz (6 s)</button>
    <button id="rand">Gestos aleatorios: sí</button>
    <h3>Registro</h3><div id="log"></div>
  </div>

  <script src="../src/renderer/avatar-engine.js"></script>
  <script>
    const avatar = AgentikAvatar.mount(document.getElementById('avatar'));
    window.avatar = avatar;
    const log = (t) => { document.getElementById('log').textContent = t; };

    const states = document.getElementById('states');
    Object.keys(AgentikAvatar.STATES).forEach((s) => {
      const b = document.createElement('button');
      b.textContent = s;
      b.onclick = () => { avatar.setAvatarState(s); [...states.children].forEach((x) => x.classList.toggle('on', x === b)); log(`estado → ${s}`); };
      if (s === 'idle') b.classList.add('on');
      states.appendChild(b);
    });

    const gestures = document.getElementById('gestures');
    Object.keys(AgentikAvatar.GESTURES).forEach((g) => {
      const b = document.createElement('button');
      b.textContent = g;
      b.onclick = async () => { log(`gesto ${g}…`); await avatar.triggerGesture(g); log(`gesto ${g} terminó`); };
      gestures.appendChild(b);
    });

    document.getElementById('rand').onclick = (e) => {
      avatar.randomGestures = !avatar.randomGestures;
      e.target.textContent = `Gestos aleatorios: ${avatar.randomGestures ? 'sí' : 'no'}`;
    };

    // Voz simulada: un oscilador cuyo volumen sube y baja como sílabas (no suena; solo alimenta el analizador).
    document.getElementById('audio').onclick = () => {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0;
      osc.frequency.value = 140;
      osc.connect(gain);
      osc.start();
      const stop = avatar.startAudioSync(gain, { audioContext: ctx });
      const timer = setInterval(() => { gain.gain.value = Math.random() < 0.25 ? 0.03 : 0.1 + Math.random() * 0.5; }, 140);
      log('audio simulado: boca + estado speaking + batuta en los picos');
      setTimeout(() => { clearInterval(timer); stop(); osc.stop(); ctx.close(); log('audio terminó'); }, 6000);
    };
  </script>
</body>
</html>
