<!doctype html>
<!--
  Demo del motor y los avatares. Sirve desde la raíz del proyecto:
    python3 -m http.server 8765      →  http://localhost:8765/tools/avatar-demo.html
  Es también el ejemplo mínimo de integración: avatars.js arma el SVG y avatar-engine.js lo anima.
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Kogn · demo del avatar</title>
  <style>
    body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #f4f4f4; color: #1e1e1e; display: flex; gap: 32px; padding: 24px; flex-wrap: wrap; }
    .stage { width: 360px; height: 360px; flex: none; }
    .stage svg { width: 100%; height: 100%; display: block; }
    .panel { max-width: 460px; }
    h3 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #777; }
    button { font: inherit; padding: 5px 10px; margin: 2px; border: 1px solid #bbb; border-radius: 8px; background: #fff; cursor: pointer; }
    button:hover { background: #eee; }
    button.on { background: #1e1e1e; color: #fff; border-color: #1e1e1e; }
    #log { font: 12px ui-monospace, monospace; color: #555; min-height: 3em; }
  </style>
</head>
<body>
  <div class="stage"><svg id="avatar"></svg></div>

  <div class="panel">
    <h3>Avatar — AgentikAvatars.build(svg, id)</h3><div id="avatars"></div>
    <h3>Estado — setAvatarState(state)</h3><div id="states"></div>
    <h3>Gesto — triggerGesture(name)</h3><div id="gestures"></div>
    <h3>Sonido y audio</h3>
    <button id="pop">Probar "pop"</button>
    <button id="audio">Simular voz (6 s)</button>
    <button id="rand">Gestos aleatorios: sí</button>
    <h3>Registro</h3><div id="log"></div>
  </div>

  <script src="../src/renderer/avatar-engine.js"></script>
  <script src="../src/renderer/avatars.js"></script>
  <script src="../src/renderer/sounds.js"></script>
  <script>
    // En esta demo los recursos están en ../assets/ (en la app, en assets/ junto al HTML)
    for (const id of AgentikAvatars.IDS) { const a = AgentikAvatars.AVATARS[id]; a.head = '../' + a.head; a.torso = '../' + a.torso; }

    const svg = document.getElementById('avatar');
    const log = (t) => { document.getElementById('log').textContent = t; };
    let avatar = null, state = 'idle', rand = true;

    function useAvatar(id) {
      if (avatar) avatar.destroy();
      AgentikAvatars.build(svg, id);
      avatar = AgentikAvatar.mount(svg, { geometry: AgentikAvatars.get(id).geometry });
      avatar.randomGestures = rand;
      avatar.setAvatarState(state);
      window.avatar = avatar;
      [...document.getElementById('avatars').children].forEach((b) => b.classList.toggle('on', b.dataset.id === id));
      log(`avatar → ${AgentikAvatars.get(id).label}`);
    }

    for (const id of AgentikAvatars.IDS) {
      const b = document.createElement('button');
      b.textContent = AgentikAvatars.AVATARS[id].label; b.dataset.id = id;
      b.onclick = () => useAvatar(id);
      document.getElementById('avatars').appendChild(b);
    }
    const states = document.getElementById('states');
    Object.keys(AgentikAvatar.STATES).forEach((s) => {
      const b = document.createElement('button');
      b.textContent = s; b.dataset.s = s;
      b.onclick = () => { state = s; avatar.setAvatarState(s); [...states.children].forEach((x) => x.classList.toggle('on', x === b)); log(`estado → ${s}`); };
      if (s === 'idle') b.classList.add('on');
      states.appendChild(b);
    });
    const gestures = document.getElementById('gestures');
    Object.keys(AgentikAvatar.GESTURES).forEach((g) => {
      const b = document.createElement('button');
      b.textContent = g;
      b.onclick = async () => { log(`gesto ${g}…`); await avatar.triggerGesture(g); log(`gesto ${g} terminó`); };
      gestures.appendChild(b);
    });

    document.getElementById('pop').onclick = () => { AgentikSounds.playPop(); log('pop'); };
    document.getElementById('rand').onclick = (e) => { rand = !rand; avatar.randomGestures = rand; e.target.textContent = `Gestos aleatorios: ${rand ? 'sí' : 'no'}`; };
    document.getElementById('audio').onclick = () => {
      const ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
      gain.gain.value = 0; osc.frequency.value = 140; osc.connect(gain); osc.start();
      const stop = avatar.startAudioSync(gain, { audioContext: ctx });
      const timer = setInterval(() => { gain.gain.value = Math.random() < 0.25 ? 0.03 : 0.1 + Math.random() * 0.5; }, 140);
      log('audio simulado: boca + estado speaking + batuta en los picos');
      setTimeout(() => { clearInterval(timer); stop(); osc.stop(); ctx.close(); log('audio terminó'); }, 6000);
    };

    useAvatar(new URLSearchParams(location.search).get('avatar') || 'nino');
  </script>
</body>
</html>
