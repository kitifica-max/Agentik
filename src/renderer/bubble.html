<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>Agetik Chat</title>
  <link rel="stylesheet" href="styles/bubble.css" />
</head>
<body>
  <div class="bubble">
    <header class="header">
      <span id="status" class="status-text">Reposo</span>
      <div class="header-actions">
        <button id="toggle" class="btn btn-sm" type="button">Activar</button>
        <button id="pause" class="btn btn-sm" type="button" hidden>Pausar</button>
        <button id="tab-chat" class="tab active" type="button">Chat</button>
        <button id="tab-memory" class="tab" type="button">Memoria</button>
        <button id="tab-files" class="tab" type="button">Archivos</button>
      </div>
    </header>

    <div id="perm" class="perm" hidden>
      ⚠ Activa permisos de Accesibilidad para leer títulos de ventana.
    </div>

    <section id="view-chat" class="view">
      <div id="messages" class="messages"></div>
      <div id="thinking" class="thinking" hidden>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div id="memory-proposal" class="memory-proposal" hidden>
        <p id="proposal-text"></p>
        <button id="proposal-approve" class="btn btn-sm btn-ok" type="button">Guardar</button>
        <button id="proposal-reject" class="btn btn-sm" type="button">Descartar</button>
      </div>
      <div id="suggestion-banner" class="suggestion-banner" hidden>
        <p id="suggestion-text"></p>
        <div class="suggestion-actions">
          <button id="suggestion-accept" class="btn btn-sm btn-ok" type="button">Abrir chat</button>
          <button id="suggestion-dismiss" class="btn btn-sm" type="button">Descartar</button>
        </div>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Escribe algo…" autocomplete="off" maxlength="4000" />
        <button type="submit" class="btn btn-send">↑</button>
      </form>
    </section>

    <section id="view-memory" class="view" hidden>
      <div id="memory-list" class="memory-list">
        <p class="muted">Sin recuerdos guardados.</p>
      </div>
    </section>

    <section id="view-files" class="view" hidden>
      <div class="folders-section">
        <div class="folders-header">
          <span class="folders-title">Carpetas autorizadas</span>
          <button id="add-folder" class="btn btn-sm btn-ok" type="button">+ Agregar</button>
        </div>
        <div id="folder-list" class="folder-list">
          <p class="muted">Sin carpetas configuradas.</p>
        </div>
      </div>
      <div class="section-divider"></div>
      <div id="file-edit-list" class="file-edit-list">
        <p class="muted">Sin operaciones pendientes.</p>
      </div>
    </section>

    <footer class="footer">
      <span class="shortcut">⌘⇧P pausa</span>
      <span id="cost" class="shortcut" title="Consumo estimado del agente"></span>
      <button id="quit" class="btn btn-sm btn-danger" type="button">Salir</button>
    </footer>
  </div>
  <script src="bubble.js"></script>
</body>
</html>
